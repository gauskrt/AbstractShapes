name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Raja Ravi Varma, "Shakuntala Patralekhan" (public domain), from Wikimedia Commons.
      # Commit your own docs/images/painting.jpg to use a different painting.
      - name: Download the painting
        run: |
          if [ ! -f docs/images/painting.jpg ]; then
            mkdir -p docs/images
            curl -fsSL -A "AbstractShapes/0.1 (https://github.com/${{ github.repository }})" \
              -o docs/images/painting.jpg \
              "https://commons.wikimedia.org/wiki/Special:FilePath/Raja_Ravi_Varma_-_Shakuntala_writing_a_love_letter_on_a_lotus_leaf.jpg"
          fi

      # Skipped when the generated images are already committed.
      - name: Generate the shape reconstructions
        run: |
          if [ ! -f docs/images/meta.json ]; then
            python scripts/make_gallery.py docs/images/painting.jpg
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

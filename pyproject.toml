[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "abstractshapes"
version = "0.1.0"
description = "Reproduce images with geometric primitives - a Python port of fogleman/primitive"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["numpy>=1.22", "Pillow>=9.1"]

[project.scripts]
abstractshapes = "abstractshapes.cli:main"

[tool.setuptools]
packages = ["abstractshapes"]
